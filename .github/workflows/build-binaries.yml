name: Build Desktop Binaries (Linux & Windows)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact_name: MusicDown-Windows-x64
            artifact_path: electron-app/release/*.exe

          - os: ubuntu-latest
            target: --linux AppImage
            artifact_name: MusicDown-Linux-AppImage
            artifact_path: electron-app/release/*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: electron-app/package*.json

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

- name: Download FFmpeg for Windows Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path electron-app/bin
          Write-Host "Descargando FFmpeg estático para Windows..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          
          Write-Host "Extrayendo archivo zip..."
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp" -Force
          
          # Mover el binario al directorio esperado por electron-builder
          Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Move-Item -Destination "electron-app/bin/ffmpeg.exe" -Force
          
          # Limpieza
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_temp
          
          # Verificación física
          Test-Path "electron-app/bin/ffmpeg.exe"

      - name: Install Node dependencies
        working-directory: electron-app
        run: npm ci || npm install

      - name: Build Electron App
        working-directory: electron-app
        run: npx electron-builder ${{ matrix.target }} --x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
